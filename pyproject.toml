[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openthai-ner"
version = "0.2.0"
description = "Production-Ready Thai Named Entity Recognition (NER) with CRF, Focal Loss, and Multi-Backbone Ensemble"
readme = "README.md"
authors = [
    { name = "Nattapong Tapachoom" }
]
license = "CC-BY-3.0"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "sentencepiece>=0.1.99",
]

[project.optional-dependencies]
train = [
    "datasets>=2.16.0",
    "accelerate>=0.26.0",
    "seqeval>=1.2.2",
    "evaluate>=0.4.0",
    "scikit-learn>=1.3.0",
]
onnx = [
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
]
demo = [
    "gradio>=4.0.0",
]
all = [
    "openthai-ner[train,onnx,demo]",
]

[project.urls]
Homepage = "https://huggingface.co/JonusNattapong/OpenThai-NER"
Repository = "https://github.com/JonusNattapong/OpenThai"

[tool.setuptools.packages.find]
include = ["openthai_ner*"]
